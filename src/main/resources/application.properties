# ==========================================
# ParkZen Backend - Application Configuration
# ==========================================

# Server
server.port=8080

# ==========================================
# MySQL Database (Aiven)
# ==========================================
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=HLzvIPcertXyZgBllWkZkUZZNPBxpdSc
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==========================================
# Data Initialization
# ==========================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==========================================
# JWT
# ==========================================
app.jwt.secret=myUltraSecureParkZenJwtSecretKey2026
app.jwt.expiration=86400000

# ==========================================
# Razorpay
# ==========================================
razorpay.key=rzp_test_Sncc3VZTN59DIE
razorpay.secret=2FZWtsU1reIDtZS47EPqYrDH

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==========================================
# Logging
# ==========================================
logging.level.com.parkzen=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# Jackson
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
